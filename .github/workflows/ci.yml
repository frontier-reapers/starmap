name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

# Grant minimum required permissions to allow dependent tools (CodeQL, uploads)
permissions:
  contents: read
  actions: read
  security-events: write
  packages: write
  id-token: write

jobs:
  # Job 1: Run JavaScript unit tests
  test-js:
    name: JavaScript Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm install
      
      - name: Run JavaScript unit tests
        run: npm run test:unit:js
      
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: js-coverage
          path: coverage/
          retention-days: 7

  # Job 2: Run Python unit tests
  test-python:
    name: Python Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run Python unit tests
        run: npm run test:unit:py
      
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-coverage
          path: htmlcov/
          retention-days: 7

  # Job 3: Generate test data and run integration tests
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          npm install
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      
      - name: Create data directories
        run: mkdir -p data public/data

      - name: Generate build info for integration job (commit)
        run: node build-info.js
      
      - name: Download latest EVE Frontier static.db
        run: |
          # Get the latest release info from the evefrontier_datasets repository
          RELEASE_INFO=$(curl -s https://api.github.com/repos/Scetrov/evefrontier_datasets/releases/latest)

          # Extract a release label (tag_name or name) for manifest metadata
          RELEASE_TAG=$(echo "$RELEASE_INFO" | jq -r '.tag_name // .name // empty')
          echo "Detected release: $RELEASE_TAG"

          # Extract the download URL for static_data.db asset (supports static.db or static_data.db)
          DOWNLOAD_URL=$(echo "$RELEASE_INFO" | jq -r '.assets[] | select(.name | test("static(_data)?\\.db")) | .browser_download_url' | head -1)

          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" == "null" ]; then
            echo "Error: Could not find static_data.db in latest release"
            echo "Available assets:"
            echo "$RELEASE_INFO" | jq -r '.assets[].name'
            exit 1
          fi

          echo "Downloading static_data.db from: $DOWNLOAD_URL"
          curl -L -o data/static.db "$DOWNLOAD_URL"

          # Verify the file was downloaded
          if [ -f data/static.db ]; then
            FILE_SIZE=$(stat -c%s data/static.db 2>/dev/null || stat -f%z data/static.db)
            echo "Successfully downloaded static.db (size: $FILE_SIZE bytes)"
          else
            echo "Error: Failed to download static.db"
            exit 1
          fi

          # Export release tag to the job environment for subsequent build step
          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV
      
      - name: Generate binary data from SQLite
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            echo "Building data with release label: $RELEASE_TAG"
            npm run build:data -- --release "$RELEASE_TAG"
          else
            echo "Building data without explicit release label"
            npm run build:data
          fi

      - name: Verify build artifacts
        run: |
          echo "build-info:"; cat public/build-info.json || true
          echo "manifest:"; cat public/data/manifest.json || true
          if [ ! -f public/build-info.json ]; then echo "ERROR: public/build-info.json missing"; exit 1; fi
          if [ -n "$RELEASE_TAG" ]; then
            manifest_release=$(jq -r '.release // empty' public/data/manifest.json)
            if [ "$manifest_release" != "$RELEASE_TAG" ]; then echo "ERROR: manifest.release ($manifest_release) != RELEASE_TAG ($RELEASE_TAG)"; exit 1; fi
            echo "Manifest release matches: $manifest_release"
          else
            echo "No RELEASE_TAG available; skipping manifest release check"
          fi
      
      - name: Run integration tests
        run: npm run test:integration
      
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Job 4: Build Docker images
  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-js, test-python, test-integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Generate build info for cache-busting
        run: |
          mkdir -p public
          echo "{\"commit\":\"$(git rev-parse --short HEAD)\",\"timestamp\":$(date +%s)000,\"buildDate\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > public/build-info.json
          cat public/build-info.json
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to GHCR using GITHUB_TOKEN
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata (tags, labels) for web image
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-web
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.web
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Extract metadata for data builder image
        id: meta-data
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-data
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push data builder image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.data
          push: true
          tags: ${{ steps.meta-data.outputs.tags }}
          labels: ${{ steps.meta-data.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job 5: Lint (optional but recommended)
  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm install
      
      - name: Run ESLint
        run: npm run lint
        continue-on-error: true
